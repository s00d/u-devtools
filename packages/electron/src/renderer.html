<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTools - Reconnecting</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #09090b;
      color: #e4e4e7;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 32px;
      width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h3 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px;
      color: #fff;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    
    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
    }
    .btn:hover {
      background-color: #3f3f46;
      border-color: #52525b;
    }

    .btn-danger {
      background-color: rgba(127, 29, 29, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(127, 29, 29, 0.5);
    }
    .btn-danger:hover {
      background-color: rgba(127, 29, 29, 0.4);
      color: #fff;
    }
    
    /* Стили для лога */
    .status {
      font-family: monospace;
      font-size: 11px;
      color: #71717a;
      margin-top: 16px;
      border-top: 1px solid #27272a;
      padding-top: 16px;
      min-height: 20px;
      word-break: break-all;
    }
    .url-badge {
      background: #27272a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h3>Connection Lost</h3>
    <p style="font-size: 13px; color: #a1a1aa; margin-bottom: 24px;">
      Target: <span class="url-badge" id="target-display">...</span>
    </p>
    
    <div class="actions">
      <button class="btn" onclick="tryReload()">Try Reloading</button>
      <button class="btn btn-danger" onclick="factoryReset()">Factory Reset Settings</button>
    </div>
    
    <div class="status" id="status-text">Initializing...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status-text');
    const targetDisplay = document.getElementById('target-display');
    
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('target') 
      ? decodeURIComponent(params.get('target')) 
      : 'http://localhost:5173/__devtools/index.html';

    targetDisplay.textContent = targetUrl;

    function tryReload() {
      if (window.electronAPI) window.electronAPI.reload();
      else window.location.reload();
    }

    async function factoryReset() {
      if (window.electronAPI) {
        statusEl.textContent = 'Resetting storage...';
        await window.electronAPI.clearStorage();
      }
    }

    async function startPolling() {
      if (!window.electronAPI) {
        statusEl.textContent = 'Electron API missing';
        return;
      }

      let dots = 0;
      const check = async () => {
        try {
          dots = (dots + 1) % 4;
          const loadingDots = '.'.repeat(dots);
          
          // Проверка соединения
          const isUp = await window.electronAPI.checkConnection(targetUrl);
          
          if (isUp) {
            statusEl.textContent = 'Server UP! Reconnecting...';
            statusEl.style.color = '#10b981';
            // Небольшая пауза перед переходом
            setTimeout(() => window.electronAPI.reload(), 200);
          } else {
            statusEl.textContent = `Polling ${new URL(targetUrl).host}${loadingDots}`;
            statusEl.style.color = '#71717a';
            setTimeout(check, 1000);
          }
        } catch (e) {
          statusEl.textContent = 'Error: ' + e.message;
          setTimeout(check, 2000);
        }
      };

      check();
    }

    startPolling();
  </script>
</body>
</html>
